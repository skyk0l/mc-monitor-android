name: Android build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and lint debug app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lint

      - uses: actions/upload-artifact@v4
        with:
          name: MC-Monitor-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
