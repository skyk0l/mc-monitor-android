name: Android build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app/build.gradle)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Build and lint debug app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lint

      - name: Name release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/MC-Monitor-Android-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: MC-Monitor-Android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/MC-Monitor-Android-*.apk
          if-no-files-found: error

      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/debug/MC-Monitor-Android-*.apk
          generate_release_notes: true
