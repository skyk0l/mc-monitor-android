name: Android build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app/build.gradle)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @(
            $env:ANDROID_KEYSTORE_BASE64,
            $env:ANDROID_KEYSTORE_PASSWORD,
            $env:ANDROID_KEY_ALIAS,
            $env:ANDROID_KEY_PASSWORD
          )
          if ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            throw "Release signing requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets."
          }
          try {
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          } catch {
            throw "ANDROID_KEYSTORE_BASE64 is not valid base64."
          }
          if ($bytes.Length -eq 0) {
            throw "The Android keystore is empty."
          }
          [IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP "mcmonitor-release.keystore"),
            $bytes
          )

      - name: Build and lint app
        run: |
          chmod +x gradlew
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ./gradlew :app:assembleRelease :app:lint
          else
            ./gradlew :app:assembleDebug :app:lint
          fi
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mcmonitor-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Name release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/MC-Monitor-Android-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: MC-Monitor-Android-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/MC-Monitor-Android-*.apk
          if-no-files-found: error

      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/release/MC-Monitor-Android-*.apk
          generate_release_notes: true

      - name: Remove release signing key
        if: always() && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP "mcmonitor-release.keystore"
          if (Test-Path -LiteralPath $keystore) {
            Remove-Item -LiteralPath $keystore -Force
          }
